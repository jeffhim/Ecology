<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <title>Google Drive 全功能測試</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google Drive 測試 App</h2>
  <div id="g_id_onload"
       data-client_id="58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com"
       data-context="signin"
       data-ux_mode="popup"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <button id="uploadBtn">Upload test.json</button>
  <button id="listBtn">List files</button>
  <button id="updateBtn">Update test.json</button>
  <button id="deleteBtn">Delete test.json</button>
  <button id="shareBtn">Share test.json (public)</button>

  <script>
    let accessToken = null;
    let uploadedFileId = null;

    function handleCredentialResponse(response) {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: "58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com",
        scope: "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive",
        callback: (tokenResponse) => {
          accessToken = tokenResponse.access_token;
          alert("成功登入並取得 access token！");
        },
      });
      client.requestAccessToken();
    }

    // 上載檔案
    document.getElementById("uploadBtn").onclick = () => {
      if (!accessToken) return alert("未有 access token");
      const metadata = { name: "test.json", mimeType: "application/json" };
      const file = new Blob([JSON.stringify({hello:"world"})], { type: "application/json" });
      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
      form.append("file", file);

      fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { "Authorization": "Bearer " + accessToken },
        body: form
      }).then(res => res.json()).then(val => {
        uploadedFileId = val.id;
        alert("檔案已上載！ID: " + val.id);
      });
    };

    // 列出檔案
    document.getElementById("listBtn").onclick = () => {
      fetch("https://www.googleapis.com/drive/v3/files?pageSize=10&fields=files(id,name)", {
        headers: { "Authorization": "Bearer " + accessToken }
      }).then(res => res.json()).then(val => {
        alert("檔案列表:\n" + val.files.map(f => f.name + " (" + f.id + ")").join("\n"));
      });
    };

    // 更新檔案
    document.getElementById("updateBtn").onclick = () => {
      if (!uploadedFileId) return alert("未有檔案 ID");
      const file = new Blob([JSON.stringify({hello:"updated"})], { type: "application/json" });
      fetch("https://www.googleapis.com/upload/drive/v3/files/" + uploadedFileId + "?uploadType=media", {
        method: "PATCH",
        headers: { "Authorization": "Bearer " + accessToken, "Content-Type": "application/json" },
        body: file
      }).then(res => res.json()).then(val => {
        alert("檔案已更新！ID: " + val.id);
      });
    };

    // 刪除檔案
    document.getElementById("deleteBtn").onclick = () => {
      if (!uploadedFileId) return alert("未有檔案 ID");
      fetch("https://www.googleapis.com/drive/v3/files/" + uploadedFileId, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + accessToken }
      }).then(() => {
        alert("檔案已刪除！");
        uploadedFileId = null;
      });
    };

    // 分享檔案（設為公開）
    document.getElementById("shareBtn").onclick = () => {
      if (!uploadedFileId) return alert("未有檔案 ID");
      fetch("https://www.googleapis.com/drive/v3/files/" + uploadedFileId + "/permissions", {
        method: "POST",
        headers: { "Authorization": "Bearer " + accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ role: "reader", type: "anyone" })
      }).then(res => res.json()).then(val => {
        alert("檔案已設為公開分享！");
      });
    };
  </script>
</body>
</html>
