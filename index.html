<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ecology & Taxonomy App</title>

  <!-- PWA manifest (必須為獨立檔案) -->
  <link rel="manifest" href="manifest.json" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- D3 for tree -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    :root{--accent:#2a9d8f;--bg:#f5f7f6;--card:#fff;--muted:#6b6b6b;--radius:12px}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:#222}
    header{background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:18px;margin:0}
    #userInfo{font-size:13px;opacity:0.95}
    main{padding:14px;max-width:980px;margin:0 auto}
    .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    label{display:block;margin:8px 0;font-size:14px}
    input[type="text"], textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e0e0e0;font-size:14px}
    textarea{min-height:84px;resize:vertical}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
    .muted{color:var(--muted);font-size:13px;margin-top:8px}
    .imageGrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .imageGrid .thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid #e6e6e6;cursor:pointer;background:#f0f0f0;display:flex;align-items:center;justify-content:center}
    .imageGrid img{width:100%;height:100%;object-fit:cover;display:block}
    #searchResult{white-space:pre-wrap;margin-top:8px;font-size:14px}
    #taxonomyTree{min-height:220px;padding:8px;border-radius:8px;background:#fff;border:1px dashed #e6e6e6}
    .resultItem{padding:8px;border-bottom:1px solid #f0f0f0;cursor:pointer}
    .resultItem:hover{background:#f7fffb}
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:999}
    .modal.open{display:flex}
    .modal .box{background:#fff;padding:12px;border-radius:10px;max-width:92%;max-height:92%;overflow:auto}
    .modal img{max-width:100%;height:auto;border-radius:8px;display:block}
    footer{padding:12px;text-align:center;color:#888;font-size:13px}
    .twoCol{display:block}
    @media (min-width:900px){ .twoCol{display:flex;gap:12px} .leftCol{flex:1} .rightCol{width:360px} }
    .cardHeader{display:flex;justify-content:space-between;align-items:center}
    .cardTitle{font-weight:600;color:#1b5e4a}
    .taxLine{font-size:12px;color:#6b6b6b;margin-top:6px}
    .debugBox{white-space:pre-wrap;background:#fff;padding:8px;border-radius:8px;margin-top:10px;border:1px solid #eee;font-size:12px}
    .btnClose{float:right;background:#eee;border:none;padding:6px;border-radius:6px}
    .taxonomyFields input{flex:1;min-width:120px;padding:8px;border-radius:8px;border:1px solid #e0e0e0}
  </style>
</head>
<body>
  <header>
    <h1>Ecology & Taxonomy</h1>
    <div id="userInfo">未登入</div>
  </header>

  <main>
    <div class="card">
      <div id="g_id_onload"
           data-client_id="58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
      <div class="muted">登入後可將紀錄與圖片儲存到你嘅 Google Drive</div>
      <div id="loginDebug" class="debugBox" style="display:none"></div>
    </div>

    <div class="twoCol">
      <div class="leftCol">
        <div class="card">
          <h3>新增 / 儲存 物種紀錄</h3>

          <label>物種名稱
            <input id="speciesName" type="text" placeholder="例如：Formica rufa">
          </label>

          <label>分類（分欄填寫）</label>
          <div id="taxonomyFields" class="taxonomyFields">
            <input id="taxKingdom" placeholder="Kingdom">
            <input id="taxPhylum"  placeholder="Phylum">
            <input id="taxClass"   placeholder="Class">
            <input id="taxOrder"   placeholder="Order">
            <input id="taxFamily"  placeholder="Family">
            <input id="taxGenus"   placeholder="Genus">
            <input id="taxSpecies" placeholder="Species">
          </div>

          <label>筆記
            <textarea id="speciesNote" placeholder="觀察地點、行為、時間等"></textarea>
          </label>

          <label>上載圖片（可多張）
            <input id="speciesImages" type="file" accept="image/*" multiple>
          </label>

          <div class="row">
            <button id="saveBtn">儲存紀錄</button>
            <button id="clearBtn" class="secondary">清除表單</button>
          </div>
          <div class="muted">儲存會建立一個 JSON 檔（包含 metadata 與圖片 fileIds），圖片會另外上載到 Drive。</div>
        </div>

        <div class="card">
          <h3>搜尋 / 列表</h3>
          <div class="row">
            <input id="searchQuery" type="text" placeholder="以名稱或關鍵字搜尋">
            <button id="searchBtn">搜尋</button>
            <button id="listBtn" class="secondary">列出最近 50 個</button>
          </div>
          <div id="searchResult"></div>
        </div>
      </div>

      <div class="rightCol">
        <div class="card">
          <h3>Taxonomy Tree</h3>
          <div id="taxonomyTree"><svg id="treeSvg" width="320" height="320"></svg></div>
          <div class="row" style="margin-top:8px">
            <button id="refreshTreeBtn">刷新樹狀圖</button>
          </div>
        </div>

        <div class="card">
          <h3>檢視 / 編輯 紀錄</h3>
          <div id="recordViewer">點擊左側列表或樹狀葉節點以檢視紀錄</div>
        </div>
      </div>
    </div>
  </main>

  <div id="imgModal" class="modal" role="dialog" aria-hidden="true">
    <div class="box">
      <button id="closeModal" class="btnClose">Close</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer>Ecology App — 測試版</footer>

  <script>
  // -------------------------
  // Config
  // -------------------------
  const CLIENT_ID = "58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com";
  const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive";
  let accessToken = null;

  // -------------------------
  // GIS callback: 取得 access token（並把 debug 顯示在頁面，方便手機測試）
  // -------------------------
  function handleCredentialResponse(resp) {
    const dbgEl = document.getElementById("loginDebug");
    dbgEl.style.display = "block";
    dbgEl.innerText = "收到 ID token 回應:\n" + JSON.stringify(resp, null, 2) + "\n\n嘗試用 token client 取得 access token...";

    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (tokenResp) => {
        dbgEl.innerText += "\n\n取得 tokenResponse:\n" + JSON.stringify(tokenResp, null, 2);
        if (tokenResp && tokenResp.access_token) {
          accessToken = tokenResp.access_token;
          document.getElementById("userInfo").innerText = "已登入（Drive 可用）";
          dbgEl.innerText += "\n\n已取得 access token。";
        } else {
          dbgEl.innerText += "\n\n未取得 access_token，可能被 popup 阻擋或授權未完成。";
        }
      }
    });

    try {
      tokenClient.requestAccessToken();
    } catch (err) {
      dbgEl.innerText += "\n\n呼叫 requestAccessToken 時發生錯誤:\n" + (err && err.message ? err.message : String(err));
    }
  }

  // -------------------------
  // Helper: fetch with Bearer
  // -------------------------
  async function driveFetch(url, opts = {}) {
    if (!accessToken) throw new Error("請先登入並授權");
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + accessToken;
    const res = await fetch(url, opts);
    if (!res.ok) {
      const txt = await res.text();
      throw new Error("Drive API 錯誤: " + res.status + " " + txt);
    }
    return res;
  }
  async function driveFetchJson(url, opts = {}) {
    const res = await driveFetch(url, opts);
    return res.json();
  }

  // -------------------------
  // Upload JSON record
  // -------------------------
  async function uploadJsonRecord(name, obj) {
    const metadata = { name: name + ".json", mimeType: "application/json" };
    const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", blob);
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { "Authorization": "Bearer " + accessToken },
      body: form
    });
    return res.json();
  }

  // -------------------------
  // Upload image file
  // -------------------------
  async function uploadImageFile(file, nameHint) {
    const meta = { name: nameHint, mimeType: file.type };
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
    form.append("file", file);
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { "Authorization": "Bearer " + accessToken },
      body: form
    });
    return res.json();
  }

  // -------------------------
  // Get JSON content by fileId
  // -------------------------
  async function getFileJson(fileId) {
    const meta = await driveFetchJson(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,mimeType`);
    if (!meta.mimeType.includes("json")) throw new Error("檔案不是 JSON");
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { "Authorization": "Bearer " + accessToken }
    });
    if (!res.ok) throw new Error("下載 JSON 失敗");
    return res.json();
  }

  // -------------------------
  // Fetch image blob and return objectURL
  // -------------------------
  async function fetchImageURL(fileId) {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { "Authorization": "Bearer " + accessToken }
    });
    if (!res.ok) throw new Error("下載圖片失敗");
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  // -------------------------
  // Collect taxonomy array from fields
  // -------------------------
  function collectTaxonomyArray() {
    const arr = [
      document.getElementById("taxKingdom").value.trim(),
      document.getElementById("taxPhylum").value.trim(),
      document.getElementById("taxClass").value.trim(),
      document.getElementById("taxOrder").value.trim(),
      document.getElementById("taxFamily").value.trim(),
      document.getElementById("taxGenus").value.trim(),
      document.getElementById("taxSpecies").value.trim()
    ].filter(Boolean);
    return arr;
  }

  // -------------------------
  // UI: Save record (text + multiple images)
  // -------------------------
  document.getElementById("saveBtn").addEventListener("click", async () => {
    try {
      if (!accessToken) return alert("請先登入並授權");
      const name = document.getElementById("speciesName").value.trim();
      if (!name) return alert("請輸入物種名稱");
      const taxonomyArray = collectTaxonomyArray();
      const note = document.getElementById("speciesNote").value.trim();
      const files = document.getElementById("speciesImages").files;

      // 1) upload images first
      const imageRefs = [];
      for (let i=0;i<files.length;i++){
        const f = files[i];
        const up = await uploadImageFile(f, `${name}_img_${Date.now()}_${i}.${f.name.split('.').pop()}`);
        imageRefs.push({ id: up.id, name: up.name, mimeType: up.mimeType });
      }

      // 2) create JSON record
      const record = {
        species: name,
        taxonomy: taxonomyArray,
        note: note,
        images: imageRefs,
        createdAt: new Date().toISOString()
      };
      const uploaded = await uploadJsonRecord(name, record);
      alert("紀錄已儲存，JSON fileId: " + uploaded.id);

      // clear form
      document.getElementById("speciesName").value = "";
      document.getElementById("taxKingdom").value = "";
      document.getElementById("taxPhylum").value = "";
      document.getElementById("taxClass").value = "";
      document.getElementById("taxOrder").value = "";
      document.getElementById("taxFamily").value = "";
      document.getElementById("taxGenus").value = "";
      document.getElementById("taxSpecies").value = "";
      document.getElementById("speciesNote").value = "";
      document.getElementById("speciesImages").value = "";

    } catch (e) {
      alert("儲存失敗: " + e.message);
    }
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    document.getElementById("speciesName").value = "";
    document.getElementById("taxKingdom").value = "";
    document.getElementById("taxPhylum").value = "";
    document.getElementById("taxClass").value = "";
    document.getElementById("taxOrder").value = "";
    document.getElementById("taxFamily").value = "";
    document.getElementById("taxGenus").value = "";
    document.getElementById("taxSpecies").value = "";
    document.getElementById("speciesNote").value = "";
    document.getElementById("speciesImages").value = "";
  });

  // -------------------------
  // Search & list
  // -------------------------
  function renderSearchList(files) {
    const el = document.getElementById("searchResult");
    el.innerHTML = "";
    if (!files || files.length === 0) { el.innerText = "無結果"; return; }
    files.forEach(f => {
      const div = document.createElement("div");
      div.className = "resultItem";
      div.innerText = `${f.name} (${f.id})`;
      div.addEventListener("click", () => loadAndShowRecord(f.id));
      el.appendChild(div);
    });
  }

  document.getElementById("searchBtn").addEventListener("click", async () => {
    try {
      const q = document.getElementById("searchQuery").value.trim();
      if (!q) return alert("請輸入搜尋關鍵字");
      const query = `mimeType='application/json' and name contains '${q.replace("'", "\\'")}'`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)`;
      const res = await driveFetchJson(url);
      renderSearchList(res.files || []);
    } catch (e) { alert("搜尋失敗: " + e.message); }
  });

  document.getElementById("listBtn").addEventListener("click", async () => {
    try {
      const q = `mimeType='application/json'`;
      const url = `https://www.googleapis.com/drive/v3/files?pageSize=50&q=${encodeURIComponent(q)}&fields=files(id,name)`;
      const res = await driveFetchJson(url);
      renderSearchList(res.files || []);
    } catch (e) { alert("列出失敗: " + e.message); }
  });

  // -------------------------
  // Load record and show viewer (card style)
  // -------------------------
  async function loadAndShowRecord(fileId) {
    try {
      const data = await getFileJson(fileId);
      const viewer = document.getElementById("recordViewer");
      viewer.innerHTML = "";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="cardHeader">
          <div>
            <div class="cardTitle">${escapeHtml(data.species || "Unnamed")}</div>
            <div class="taxLine">${(data.taxonomy || []).join(" › ")}</div>
          </div>
          <div style="font-size:12px;color:#999">${new Date(data.createdAt || "").toLocaleDateString()}</div>
        </div>
        <p style="margin-top:8px;color:#333">${escapeHtml(data.note || "")}</p>
      `;
      viewer.appendChild(card);

      if (data.images && data.images.length) {
        const grid = document.createElement("div"); grid.className="imageGrid";
        for (const img of data.images) {
          const wrap = document.createElement("div"); wrap.className="thumb";
          const imgEl = document.createElement("img"); imgEl.alt = img.name || "image";
          fetchImageURL(img.id).then(url => { imgEl.src = url; }).catch(()=>{ imgEl.alt="無法下載"; });
          wrap.appendChild(imgEl);
          wrap.addEventListener("click", async () => {
            try {
              const url = await fetchImageURL(img.id);
              document.getElementById("modalContent").innerHTML = `<img src="${url}" alt="image">`;
              document.getElementById("imgModal").classList.add("open");
            } catch (e) {
              alert("無法下載圖片");
            }
          });
          grid.appendChild(wrap);
        }
        viewer.appendChild(grid);
      }

      // edit area
      const editDiv = document.createElement("div"); editDiv.style.marginTop="10px";
      editDiv.innerHTML = `
        <label>更新 taxonomy（分欄）</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <input id="editTaxKingdom" placeholder="Kingdom" style="flex:1;min-width:100px">
          <input id="editTaxPhylum" placeholder="Phylum" style="flex:1;min-width:100px">
          <input id="editTaxClass" placeholder="Class" style="flex:1;min-width:100px">
          <input id="editTaxOrder" placeholder="Order" style="flex:1;min-width:100px">
          <input id="editTaxFamily" placeholder="Family" style="flex:1;min-width:100px">
          <input id="editTaxGenus" placeholder="Genus" style="flex:1;min-width:100px">
          <input id="editTaxSpecies" placeholder="Species" style="flex:1;min-width:100px">
        </div>
        <label style="margin-top:8px">更新筆記 <textarea id="editNoteArea" rows="3"></textarea></label>
        <label>新增圖片 <input id="editAddImages" type="file" accept="image/*" multiple></label>
        <div class="row" style="margin-top:8px">
          <button id="saveEditBtn">儲存修改</button>
          <button id="deleteJsonBtn" class="secondary">刪除紀錄 (只刪 JSON)</button>
        </div>
      `;
      viewer.appendChild(editDiv);

      // prefill edit taxonomy & note
      const taxArr = data.taxonomy || [];
      document.getElementById("editTaxKingdom").value = taxArr[0] || "";
      document.getElementById("editTaxPhylum").value = taxArr[1] || "";
      document.getElementById("editTaxClass").value = taxArr[2] || "";
      document.getElementById("editTaxOrder").value = taxArr[3] || "";
      document.getElementById("editTaxFamily").value = taxArr[4] || "";
      document.getElementById("editTaxGenus").value = taxArr[5] || "";
      document.getElementById("editTaxSpecies").value = taxArr[6] || "";
      document.getElementById("editNoteArea").value = data.note || "";

      document.getElementById("saveEditBtn").addEventListener("click", async () => {
        try {
          const newTax = [
            document.getElementById("editTaxKingdom").value.trim(),
            document.getElementById("editTaxPhylum").value.trim(),
            document.getElementById("editTaxClass").value.trim(),
            document.getElementById("editTaxOrder").value.trim(),
            document.getElementById("editTaxFamily").value.trim(),
            document.getElementById("editTaxGenus").value.trim(),
            document.getElementById("editTaxSpecies").value.trim()
          ].filter(Boolean);
          const newNote = document.getElementById("editNoteArea").value.trim();
          const addFiles = document.getElementById("editAddImages").files;

          if (addFiles && addFiles.length) {
            for (let i=0;i<addFiles.length;i++){
              const up = await uploadImageFile(addFiles[i], `${data.species||'img'}_add_${Date.now()}_${i}.${addFiles[i].name.split('.').pop()}`);
              data.images = data.images || [];
              data.images.push({ id: up.id, name: up.name, mimeType: up.mimeType });
            }
          }

          data.taxonomy = newTax;
          data.note = newNote;
          data.updatedAt = new Date().toISOString();

          const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
          const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
            method: "PATCH",
            headers: { "Authorization": "Bearer " + accessToken, "Content-Type": "application/json" },
            body: blob
          });
          const j = await res.json();
          alert("已更新紀錄: " + j.id);
          loadAndShowRecord(fileId);
        } catch (e) { alert("更新失敗: " + e.message); }
      });

      document.getElementById("deleteJsonBtn").addEventListener("click", async () => {
        if (!confirm("確定刪除此 JSON 紀錄？（圖片不會自動刪除）")) return;
        await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
          method: "DELETE",
          headers: { "Authorization": "Bearer " + accessToken }
        });
        alert("已刪除 JSON 紀錄");
        document.getElementById("recordViewer").innerHTML = "";
      });

    } catch (e) {
      alert("載入紀錄失敗: " + e.message);
    }
  }

  // -------------------------
  // Modal close
  // -------------------------
  document.getElementById("closeModal").addEventListener("click", ()=> {
    document.getElementById("imgModal").classList.remove("open");
    document.getElementById("modalContent").innerHTML = "";
  });

  // -------------------------
  // Taxonomy tree: build from JSON records and render with D3
  // -------------------------
  async function buildTaxonomyTree() {
    try {
      const q = `mimeType='application/json'`;
      const url = `https://www.googleapis.com/drive/v3/files?pageSize=200&q=${encodeURIComponent(q)}&fields=files(id,name)`;
      const res = await driveFetchJson(url);
      const files = res.files || [];
      const nodes = [];
      for (const f of files) {
        try {
          const data = await getFileJson(f.id);
          const tax = (data.taxonomy || []);
          nodes.push({ id: f.id, name: data.species || f.name, taxonomy: tax });
        } catch (e) { /* skip */ }
      }
      const root = { name: "Life", children: [] };
      for (const n of nodes) {
        let cursor = root;
        const levels = n.taxonomy.length ? n.taxonomy : ["Unclassified"];
        for (const lvl of levels) {
          let child = cursor.children.find(c => c.name === lvl);
          if (!child) { child = { name: lvl, children: [] }; cursor.children.push(child); }
          cursor = child;
        }
        cursor.children = cursor.children || [];
        cursor.children.push({ name: n.name, fileId: n.id, leaf: true });
      }
      renderD3Tree(root);
    } catch (e) {
      console.error("build tree error", e);
    }
  }

  function renderD3Tree(data) {
    const svgEl = d3.select("#treeSvg");
    svgEl.selectAll("*").remove();
    const width = +svgEl.attr("width") || 320;
    const height = +svgEl.attr("height") || 320;
    const root = d3.hierarchy(data);
    const treeLayout = d3.tree().size([height-20, width-40]);
    treeLayout(root);

    svgEl.append("g")
      .selectAll("path")
      .data(root.links())
      .enter()
      .append("path")
      .attr("d", d => `M${d.source.y+20},${d.source.x}C${d.source.y+60},${d.source.x} ${d.target.y-20},${d.target.x} ${d.target.y},${d.target.x}`)
      .attr("fill","none").attr("stroke","#9aa").attr("stroke-width",1.2);

    const node = svgEl.append("g")
      .selectAll("g")
      .data(root.descendants())
      .enter()
      .append("g")
      .attr("transform", d => `translate(${d.y},${d.x})`);

    node.append("circle")
      .attr("r", d => d.data.leaf ? 5 : 4)
      .attr("fill", d => d.data.leaf ? "#2a9d8f" : "#fff")
      .attr("stroke", "#2a9d8f");

    node.append("text")
      .attr("x", 8)
      .attr("y", 4)
      .text(d => d.data.name)
      .style("font-size","12px")
      .on("click", (event,d) => {
        if (d.data.leaf && d.data.fileId) loadAndShowRecord(d.data.fileId);
      });
  }

  document.getElementById("refreshTreeBtn").addEventListener("click", async () => {
    if (!accessToken) return alert("請先登入");
    await buildTaxonomyTree();
  });

  // -------------------------
  // Init: register service worker for PWA caching
  // -------------------------
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(()=>{ console.log('sw registered'); }).catch(()=>{ console.log('sw failed'); });
  }

  // -------------------------
  // small helpers
  // -------------------------
  function escapeHtml(s){ return (s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
  </script>
</body>
</html>
