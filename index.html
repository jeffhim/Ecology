<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <title>Ecology & Taxonomy App</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    textarea, input { display:block; margin:10px 0; width:300px; }
    button { margin:5px; }
    #taxonomyTree { border:1px solid #ccc; padding:10px; margin-top:20px; }
    svg { width: 100%; height: 500px; }
  </style>
</head>
<body>
  <h2>生態學與分類學紀錄 App</h2>

  <!-- Google Sign-In -->
  <div id="g_id_onload"
       data-client_id="58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com"
       data-context="signin"
       data-ux_mode="popup"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <!-- 新增物種紀錄 -->
  <h3>新增物種紀錄</h3>
  <input type="text" id="speciesName" placeholder="物種名稱">
  <textarea id="speciesNote" placeholder="筆記"></textarea>
  <input type="file" id="speciesImages" multiple>
  <button id="saveBtn">Save to Drive</button>

  <!-- 修改紀錄 -->
  <h3>修改物種紀錄</h3>
  <input type="text" id="editFileId" placeholder="Drive 檔案 ID">
  <textarea id="editNote" placeholder="新筆記"></textarea>
  <button id="updateBtn">Update Record</button>

  <!-- 搜尋紀錄 -->
  <h3>搜尋物種</h3>
  <input type="text" id="searchQuery" placeholder="搜尋關鍵字">
  <button id="searchBtn">Search</button>
  <div id="searchResult"></div>

  <!-- Taxonomy Tree -->
  <h3>Taxonomy Tree</h3>
  <div id="taxonomyTree"><svg id="treeSvg"></svg></div>
<script>
  let accessToken = null;
  let taxonomyData = { name: "Life", children: [] };

  function handleCredentialResponse(response) {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: "58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com",
      scope: "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive",
      callback: (tokenResponse) => {
        accessToken = tokenResponse.access_token;
        alert("成功登入！");
      },
    });
    client.requestAccessToken();
  }

  // 儲存物種紀錄（文字 + 多圖片）
  document.getElementById("saveBtn").onclick = async () => {
    if (!accessToken) return alert("未登入");
    const name = document.getElementById("speciesName").value;
    const note = document.getElementById("speciesNote").value;
    const files = document.getElementById("speciesImages").files;

    // JSON metadata
    const metadata = { name: name + ".json", mimeType: "application/json" };
    const jsonData = new Blob([JSON.stringify({species:name, note:note})], { type: "application/json" });

    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", jsonData);

    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { "Authorization": "Bearer " + accessToken },
      body: form
    });
    const val = await res.json();
    alert("物種紀錄已儲存！ID: " + val.id);

    // 上載多張圖片
    for (let i=0; i<files.length; i++) {
      const imgMeta = { name: name + "_img" + (i+1) + ".jpg", mimeType: files[i].type };
      const imgForm = new FormData();
      imgForm.append("metadata", new Blob([JSON.stringify(imgMeta)], { type: "application/json" }));
      imgForm.append("file", files[i]);

      await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { "Authorization": "Bearer " + accessToken },
        body: imgForm
      });
    }
    alert("圖片已全部上載！");

    // 更新 taxonomy tree
    taxonomyData.children.push({ name: name, children: [] });
    renderTree(taxonomyData);
  };  // 修改紀錄
  document.getElementById("updateBtn").onclick = async () => {
    if (!accessToken) return alert("未登入");
    const fileId = document.getElementById("editFileId").value;
    const newNote = document.getElementById("editNote").value;
    const file = new Blob([JSON.stringify({note:newNote})], { type: "application/json" });

    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
      method: "PATCH",
      headers: { "Authorization": "Bearer " + accessToken, "Content-Type": "application/json" },
      body: file
    });
    const val = await res.json();
    alert("紀錄已更新！ID: " + val.id);
  };

  // 搜尋紀錄
  document.getElementById("searchBtn").onclick = async () => {
    const query = document.getElementById("searchQuery").value;
    const res = await fetch("https://www.googleapis.com/drive/v3/files?q=name contains '" + query + "'&fields=files(id,name)", {
      headers: { "Authorization": "Bearer " + accessToken }
    });
    const val = await res.json();
    document.getElementById("searchResult").innerText =
      val.files.map(f => f.name + " (" + f.id + ")").join("\n");
  };  // 用 D3.js 畫樹狀圖
  function renderTree(data) {
    d3.select("#treeSvg").selectAll("*").remove();

    const width = 600, height = 400;
    const svg = d3.select("#treeSvg")
      .attr("width", width)
      .attr("height", height);

    const root = d3.hierarchy(data);
    const treeLayout = d3.tree().size([height, width-100]);
    treeLayout(root);

    svg.selectAll('line')
      .data(root.links())
      .enter()
      .append('line')
      .attr('x1', d => d.source.y)
      .attr('y1', d => d.source.x)
      .attr('x2', d => d.target.y)
      .attr('y2', d => d.target.x)
      .attr('stroke', 'black');

    svg.selectAll('circle')
      .data(root.descendants())
      .enter()
      .append('circle')
      .attr('cx', d => d.y)
      .attr('cy', d => d.x)
      .attr('r', 5)
      .attr('fill', 'steelblue');

    svg.selectAll('text')
      .data(root.descendants())
      .enter()
      .append('text')
      .attr('x', d => d.y + 10)
      .attr('y', d => d.x + 5)
      .text(d => d.data.name);
  }
</script>
</body>
</html>
