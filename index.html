<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <title>Google Drive Test</title>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <h2>Google Drive 測試 App</h2>
  <button id="loginBtn">Login with Google</button>
  <button id="uploadBtn">Upload test.json</button>

  <script>
    function initClient() {
      gapi.client.init({
        clientId: "58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com",
        discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
        scope: "https://www.googleapis.com/auth/drive.file"
      }).then(() => {
        const auth = gapi.auth2.getAuthInstance();

        // 登入按鈕
        document.getElementById("loginBtn").onclick = () => {
          auth.signIn().then(user => {
            alert("Login success: " + user.getBasicProfile().getName());
          });
        };

        // 上傳按鈕
        document.getElementById("uploadBtn").onclick = () => {
          const accessToken = gapi.auth.getToken().access_token;
          const metadata = { name: "test.json", mimeType: "application/json" };
          const file = new Blob([JSON.stringify({hello:"world"})], { type: "application/json" });
          const form = new FormData();
          form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
          form.append("file", file);

          fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
            method: "POST",
            headers: new Headers({ "Authorization": "Bearer " + accessToken }),
            body: form
          }).then(res => res.json()).then(val => {
            alert("File uploaded to Drive! File ID: " + val.id);
            console.log("Uploaded file:", val);
          });
        };
      });
    }

    gapi.load("client:auth2", initClient);
  </script>
</body>
</html>
