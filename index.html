<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <title>Google Drive 測試 (GIS)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google Drive 測試 App (新版)</h2>
  <div id="g_id_onload"
       data-client_id="58009415485-8qvhrvbasmrq5ugms01dv8vt7pneen6u.apps.googleusercontent.com"
       data-context="signin"
       data-ux_mode="popup"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <button id="uploadBtn">Upload test.json</button>

  <script>
    let accessToken = null;

    function handleCredentialResponse(response) {
      alert("登入成功！ID Token: " + response.credential);
      // ⚠️ 注意：新版 GIS 只會俾 ID Token，唔會直接俾 access token
      // 如果要用 Google Drive API，要再用 OAuth 2.0 flow 換取 access token
    }

    document.getElementById("uploadBtn").onclick = () => {
      if (!accessToken) {
        alert("未有 access token，Drive API 上載唔會成功。");
        return;
      }
      // 上載檔案嘅程式碼（同之前一樣）
    };
  </script>
</body>
</html>
